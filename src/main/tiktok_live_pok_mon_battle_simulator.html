<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok LIVE Pokémon Battle Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            user-select: none;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { transform: translateY(-35px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-70px) scale(0.9); }
        }
        .float-text {
            animation: floatUp 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            pointer-events: none;
        }

        .badge-live {
            background: linear-gradient(90deg, #ff0050, #00f2fe);
        }

        /* --- EFECTOS ESTILO M.U.G.E.N --- */
        @keyframes mugenDashLeft {
            0% { transform: translateX(0) scale(1); }
            30% { transform: translateX(-15px) scale(0.95); }
            50% { transform: translateX(70px) scale(1.1); }
            100% { transform: translateX(0) scale(1); }
        }
        .mugen-attack-p1 {
            animation: mugenDashLeft 0.35s ease-in-out;
        }

        @keyframes mugenHitShake {
            0%, 100% { transform: translateX(0); filter: brightness(1); }
            20% { transform: translateX(-10px) rotate(-5deg); filter: brightness(2) sepia(1) hue-rotate(-50deg); }
            40% { transform: translateX(10px) rotate(5deg); filter: brightness(2) sepia(1) hue-rotate(-50deg); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .mugen-hit {
            animation: mugenHitShake 0.4s ease-in-out;
        }

        @keyframes mugenEvolveAura {
            0% { filter: drop-shadow(0 0 5px #fff) brightness(1); transform: scale(1); }
            50% { filter: drop-shadow(0 0 35px #38bdf8) brightness(2.2) contrast(1.5); transform: scale(1.12); }
            100% { filter: drop-shadow(0 0 5px #fff) brightness(1); transform: scale(1); }
        }
        .mugen-evolving {
            animation: mugenEvolveAura 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col lg:flex-row bg-slate-950">

    <!-- MAIN STREAM CANVAS / DISPLAY AREA -->
    <main class="relative flex-1 h-full flex flex-col justify-between overflow-hidden bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 border-r border-slate-800">
        
        <!-- STREAM OVERLAY TOP HUD -->
        <header class="absolute top-0 left-0 right-0 z-30 p-4 flex justify-between items-center bg-gradient-to-b from-slate-950/80 to-transparent pointer-events-none">
            <div class="flex items-center gap-3 pointer-events-auto">
                <div class="badge-live text-white font-extrabold px-3 py-1 rounded-full text-xs flex items-center gap-1.5 shadow-lg tracking-wider">
                    <span class="w-2 h-2 rounded-full bg-white animate-ping"></span> LIVE
                </div>
                <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-full px-3 py-1 text-xs text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-users text-pink-400"></i>
                    <span id="viewer-count" class="font-bold">842</span> Espectadores
                </div>
                <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-full px-3 py-1 text-xs text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-heart text-rose-500"></i>
                    <span id="like-count" class="font-bold">14,200</span> Likes
                </div>
            </div>

            <!-- STREAM HUD RULES / GUIDE -->
            <div class="bg-slate-900/90 backdrop-blur-md border border-indigo-500/30 rounded-2xl p-2.5 shadow-2xl flex items-center gap-4 pointer-events-auto text-xs hidden md:flex">
                <div class="flex items-center gap-1.5 text-emerald-400 font-bold">
                    <i class="fa-solid fa-hand-pointer animate-bounce"></i> Tap-Tap = +2 HP
                </div>
                <div class="h-4 w-px bg-slate-700"></div>
                <div class="flex items-center gap-1.5 text-rose-400 font-bold">
                    <span>🌹 Rosa</span> = +15 EXP
                </div>
                <div class="h-4 w-px bg-slate-700"></div>
                <div class="flex items-center gap-1.5 text-amber-400 font-bold">
                    <span>🍩 Donut</span> = +60 EXP / Evolución
                </div>
            </div>
        </header>

        <!-- BATTLE ARENA MAIN SCREEN -->
        <section class="relative z-10 h-full w-full flex flex-col justify-between p-4 md:p-8 pt-20">
            
            <!-- TOP HEALTH BARS & STATUS HUD -->
            <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-4 max-w-5xl mx-auto">
                
                <!-- PLAYER HEALTH CARD -->
                <div id="player-container" class="relative bg-slate-900/90 backdrop-blur-md border-2 border-emerald-500/40 rounded-2xl p-4 shadow-xl">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 id="poke-name" class="font-extrabold text-lg text-white">Bulbasaur (#001)</h3>
                                <span id="stage-badge" class="text-xs bg-emerald-500/30 text-emerald-300 px-2 py-0.5 rounded font-bold">Fase 1 / 3</span>
                            </div>
                            <p class="text-xs text-emerald-400 font-semibold">@StreamerMain (Jugador 1)</p>
                        </div>
                        <span id="player-hp-text" class="font-pixel text-xs text-emerald-400">180 / 180 HP</span>
                    </div>

                    <!-- HP BAR -->
                    <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700 mb-2">
                        <div id="player-hp-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-300 w-full"></div>
                    </div>

                    <!-- EXP BAR -->
                    <div class="flex justify-between items-center text-[10px] text-slate-400 mb-1">
                        <span>Progreso de Evolución (EXP)</span>
                        <span id="exp-text" class="font-bold text-amber-400">0 / 100 EXP</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                        <div id="exp-bar" class="bg-gradient-to-r from-amber-500 to-yellow-300 h-full rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <!-- ENEMY HEALTH CARD -->
                <div id="enemy-container" class="relative bg-slate-900/90 backdrop-blur-md border-2 border-rose-500/40 rounded-2xl p-4 shadow-xl">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 id="enemy-name" class="font-extrabold text-lg text-white">Charmander (#004)</h3>
                                <span class="text-xs bg-rose-500/30 text-rose-300 px-2 py-0.5 rounded font-bold">Rival (Jugador 2)</span>
                            </div>
                            <p class="text-xs text-rose-400 font-semibold">Retador TikTok</p>
                        </div>
                        <span id="enemy-hp-text" class="font-pixel text-xs text-rose-400">160 / 160 HP</span>
                    </div>

                    <!-- ENEMY HP BAR -->
                    <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
                        <div id="enemy-hp-bar" class="bg-gradient-to-r from-rose-500 to-red-400 h-full rounded-full transition-all duration-300 w-full"></div>
                    </div>
                </div>

            </div>

            <!-- BATTLEFIELD SPRITES DISPLAY AREA -->
            <div class="relative flex-1 w-full max-w-4xl mx-auto flex items-center justify-around px-4 my-2">
                
                <!-- PLAYER SPRITE -->
                <div class="relative flex flex-col items-center group">
                    <div class="w-40 h-10 bg-emerald-500/10 rounded-full border border-emerald-500/20 blur-xs absolute bottom-0"></div>
                    <img id="player-sprite" src="" alt="Player Pokémon" class="relative z-10 w-44 h-44 md:w-56 md:h-56 object-contain filter drop-shadow-[0_15px_15px_rgba(0,0,0,0.8)] transition-transform duration-200">
                </div>

                <!-- VS BADGE -->
                <div class="relative z-10 flex flex-col items-center">
                    <span class="font-pixel text-3xl md:text-5xl italic text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-rose-500 drop-shadow-lg animate-pulse">
                        VS
                    </span>
                </div>

                <!-- ENEMY SPRITE -->
                <div class="relative flex flex-col items-center group">
                    <div class="w-40 h-10 bg-rose-500/10 rounded-full border border-rose-500/20 blur-xs absolute bottom-0"></div>
                    <img id="enemy-sprite" src="" alt="Enemy Pokémon" class="relative z-10 w-40 h-40 md:w-52 md:h-52 object-contain filter drop-shadow-[0_15px_15px_rgba(0,0,0,0.8)] transition-all duration-200">
                </div>

            </div>

            <!-- ACTION CONTROLS / LOG BANNER -->
            <div class="w-full max-w-4xl mx-auto space-y-2">
                <div class="flex justify-center gap-3">
                    <button id="move-btn" onclick="playerAttack()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center gap-2">
                        ⚡ Látigo Cepa
                    </button>
                    <button onclick="tapBoostHp()" class="px-6 py-2.5 bg-pink-600 hover:bg-pink-500 text
